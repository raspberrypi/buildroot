image boot.vfat {
	vfat {
		files = {
			"bcm2710-rpi-cm0.dtb",
			"bcm2710-rpi-zero-2.dtb",
			"bcm2710-rpi-zero-2-w.dtb",
			"bcm2710-rpi-3-b.dtb",
			"bcm2710-rpi-3-b-plus.dtb",
			"bcm2710-rpi-cm3.dtb",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/config.txt",
			"rpi-firmware/fixup4cd.dat",
			"rpi-firmware/start4cd.elf",
			"rpi-firmware/overlays",
			"zImage",
			"rootfs.cpio.zst"
		}
	}

	size = 15M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}
}
